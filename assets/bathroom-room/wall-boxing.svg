<path d="M122.2 789H136.2M122.2 165H136.2M129.2 789V165" class="dim"/><text x="119.2" y="477" class="dimtext" text-anchor="middle" transform="rotate(-90 119.2 477)">260 от чистого пола</text>
<path d="M195.2 831V845M804.8 831V845M195.2 838H804.8" class="dim"/><text x="500" y="828" class="dimtext" text-anchor="middle">254 — ширина этой стены</text>
<path d="M45 878H955" stroke="#d8dcd5"/>
<text x="45" y="909" font-size="14" class="muted">Короб глубиной 25 идёт без ступенек от стены с тумбой до душа. За торцом стена уходит назад на 25.</text>
<text x="45" y="936" font-size="14" class="muted">Ниша шкафа — предложение: ширина 70, низ 130, верх 250. Над ней до потолка 10.</text>
<text x="45" y="963" font-size="14" class="muted">Колонна на этой же стороне комнаты; трап параллелен стене. Стекло здесь видно с ребра.</text>
<text x="45" y="990" font-size="14" class="muted">Унитаз: 26 до стекла, 39 до тумбы; верх керамики 40, посадка с электронным сиденьем 43–44.</text>
<text x="45" y="1017" font-size="14" class="muted">* Номинальный трап 90 занимает всю стену душа 90: полный монтажный габарит проверить. Ось вытяжки 235 предварительная.</text>
<text x="45" y="1040" font-size="12" class="muted">Сантехника обозначена условно. Размеры в см; монтажные уровни оборудования уточняются по изделиям.</text></svg>