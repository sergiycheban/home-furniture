<text x="479.6" y="299.4" font-size="15" class="woodtext" text-anchor="middle">Шкаф 70 × 120</text>
<text x="479.6" y="328.2" font-size="13" class="woodtext" text-anchor="middle">внутри короба</text>
<text x="479.6" y="357" font-size="13" class="woodtext" text-anchor="middle">фасад заподлицо</text>
<path d="M395.6 167.6V181.6M563.6 167.6V181.6M395.6 174.6H563.6" class="dim"/><text x="479.6" y="164.6" class="dimtext" text-anchor="middle">70</text>
