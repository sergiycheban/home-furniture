<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1060" viewBox="0 0 1000 1060" role="img" aria-labelledby="title desc">
<title id="title">Стена с коробом и душевой колонной</title><desc id="desc">Смотрим от двери на противоположную стену. Тумба слева, душевая справа.</desc>
