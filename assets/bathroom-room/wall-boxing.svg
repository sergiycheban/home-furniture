<rect x="588.8" y="786.6" width="216" height="2.4" rx="0" fill="#839687" stroke="#52695b" stroke-width="1" class=""/>
<text x="696.8" y="760.2" font-size="14" class="" text-anchor="middle">Трап 90 вдоль стены*</text>
