<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1060" viewBox="0 0 1000 1060" role="img" aria-labelledby="title desc">
<title id="title">Ниша под шкаф над унитазом</title><desc id="desc">Ширина 70 × высота 120. Показан только габарит ниши; наполнение будет рассчитано позже.</desc>
<defs><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#f1ede5"/><path d="M0 0V10" stroke="#dbd2c4"/></pattern></defs>
<style>text{font-family:'Segoe UI',sans-serif;fill:#29342e}.small{font-size:14px}.dim{fill:none;stroke:#778178;stroke-width:1}.dimtext{font-size:16px;fill:#58635b}.muted{fill:#687169}.blue{fill:#286b81}.projection{fill:none;stroke:#8e9d94;stroke-width:1.5;stroke-dasharray:6 5}.woodtext{fill:#fff;font-size:13px}.metal{fill:none;stroke:#738277;stroke-width:3}</style>
<rect width="1000" height="1060" fill="#fff"/>
<text x="45" y="39" font-size="12" letter-spacing="2" class="muted">ВАННАЯ · РАЗВЁРТКА СТЕНЫ</text>
<text x="45" y="77" font-size="27">Ниша под шкаф над унитазом</text>
<text x="45" y="106" class="small muted">Ширина 70 × высота 120. Показан только габарит ниши; наполнение будет рассчитано позже.</text>
<rect x="320" y="165" width="360" height="624" rx="0" fill="#faf9f5" stroke="#879389" stroke-width="1.5" class=""/>
<rect x="320" y="165" width="360" height="624" rx="0" fill="url(#hatch)" stroke="#879389" stroke-width="1.5" class=""/>
<rect x="416" y="189" width="168" height="288" rx="0" fill="#fff" stroke="#614d3d" stroke-width="2" class=""/>
<text x="500" y="316.2" font-size="18" class="" text-anchor="middle">Ниша 70 × 120</text>
<text x="500" y="349.8" font-size="14" class="muted" text-anchor="middle">Наполнение позже</text>
<path d="M416 136V150M584 136V150M416 143H584" class="dim"/><text x="500" y="133" class="dimtext" text-anchor="middle">70 · ниша</text>
<path d="M598.6 477H612.6M598.6 189H612.6M605.6 477V189" class="dim"/><text x="595.6" y="333" class="dimtext" text-anchor="middle" transform="rotate(-90 595.6 333)">120 · ниша</text>
<path d="M286 789H300M286 477H300M293 789V477" class="dim"/><text x="283" y="633" class="dimtext" text-anchor="middle" transform="rotate(-90 283 633)">130 до низа ниши</text>
<text x="500" y="177" font-size="13" class="" text-anchor="middle">10 до потолка</text>
<text x="500" y="549" font-size="16" class="" text-anchor="middle">Глубина короба 25</text>
<text x="500" y="582.6" font-size="13" class="muted" text-anchor="middle">На плане ниша занимает</text>
<text x="500" y="606.6" font-size="13" class="muted" text-anchor="middle">всю глубину короба</text>
<text x="500" y="654.6" font-size="14" class="" text-anchor="middle">Полезные размеры шкафа</text>
<text x="500" y="678.6" font-size="13" class="muted" text-anchor="middle">будут рассчитаны отдельно</text>
<text x="500" y="724.2" font-size="14" class="" text-anchor="middle">Под шкафом — инсталляция</text>
<path d="M247 789H261M247 165H261M254 789V165" class="dim"/><text x="244" y="477" class="dimtext" text-anchor="middle" transform="rotate(-90 244 477)">260 от чистого пола</text>
<path d="M45 878H955" stroke="#d8dcd5"/>
<text x="45" y="909" font-size="14" class="muted">Ниша: 70 вдоль стены × 120 по высоте; низ на 130, верх на 250, до потолка 10.</text>
<text x="45" y="936" font-size="14" class="muted">На плане сверху её проекция идёт от задней стены до лицевой плоскости короба: все 25 см.</text>
<text x="45" y="963" font-size="14" class="muted">Толщины корпуса, задника, фасадов и полки не назначены. Внутреннее наполнение — позже.</text>
<text x="45" y="1040" font-size="12" class="muted">Сантехника обозначена условно. Размеры в см; монтажные уровни оборудования уточняются по изделиям.</text></svg>