<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1060" viewBox="0 0 1000 1060" role="img" aria-labelledby="title desc">
<title id="title">Шкаф над унитазом — наполнение</title><desc id="desc">Предложение: ниша 70 × 120, низ 130, верх 250. Короб и размеры ниши проверяются по замеру.</desc>
