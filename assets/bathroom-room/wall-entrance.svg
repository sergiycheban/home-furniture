<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1060" viewBox="0 0 1000 1060" role="img" aria-labelledby="title desc">
<title id="title">Стена с входной дверью</title><desc id="desc">Смотрим от короба к двери. Душевая слева на развёртке, тумба справа.</desc>
<defs><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#f1ede5"/><path d="M0 0V10" stroke="#dbd2c4"/></pattern></defs>
<style>text{font-family:'Segoe UI',sans-serif;fill:#29342e}.small{font-size:14px}.dim{fill:none;stroke:#778178;stroke-width:1}.dimtext{font-size:16px;fill:#58635b}.muted{fill:#687169}.blue{fill:#286b81}.projection{fill:none;stroke:#8e9d94;stroke-width:1.5;stroke-dasharray:6 5}.woodtext{fill:#fff;font-size:13px}.metal{fill:none;stroke:#738277;stroke-width:3}</style>
<rect width="1000" height="1060" fill="#fff"/>
<text x="45" y="39" font-size="12" letter-spacing="2" class="muted">ВАННАЯ · РАЗВЁРТКА СТЕНЫ</text>
<text x="45" y="77" font-size="27">Стена с входной дверью</text>
<text x="45" y="106" class="small muted">Смотрим от короба к двери. Душевая слева на развёртке, тумба справа.</text>
<rect x="190.4" y="165" width="619.2" height="624" rx="0" fill="#faf9f5" stroke="#879389" stroke-width="1.5" class=""/>
<rect x="190.4" y="165" width="225.6" height="624" rx="0" fill="#eef3ef" stroke="#879389" stroke-width="1.5" class=""/>
<path d="M416 789L416 309" fill="none" stroke="#4388a1" stroke-width="4" class=""/>
<text x="300.8" y="489" font-size="19" class="" text-anchor="middle">Душевая</text>
<text x="300.8" y="520.2" font-size="15" class="" text-anchor="middle">глубина 94</text>
<rect x="437.6" y="285" width="196.8" height="504" rx="0" fill="#f1f0e9" stroke="#89958c" stroke-width="2" class=""/>
<rect x="444.8" y="292.2" width="182.4" height="494.4" rx="0" fill="none" stroke="#b3b9b0" stroke-width="1" class=""/>
<path d="M599.6 551.4L616.4 551.4" fill="none" stroke="#cbd0c8" stroke-width="3" class=""/>
<text x="536" y="409.8" font-size="19" class="" text-anchor="middle">Вход · 82</text>
<text x="536" y="441" font-size="13" class="muted" text-anchor="middle">Высота проёма</text>
<text x="536" y="465" font-size="13" class="muted" text-anchor="middle">по замеру</text>
<rect x="668" y="585" width="141.6" height="180" rx="0" fill="#8a674b" stroke="#614d3d" stroke-width="1.5" class=""/>
<rect x="689.6" y="765" width="120" height="24" rx="0" fill="#574635" stroke="#574635" stroke-width="1.5" class=""/>
<rect x="665.6" y="580.2" width="144" height="4.8" rx="0" fill="#e8e8df" stroke="#879389" stroke-width="1.5" class=""/>
<text x="737.6" y="673.8" font-size="16" class="woodtext" text-anchor="middle">Тумба</text>
<text x="737.6" y="702.6" font-size="13" class="woodtext" text-anchor="middle">глубина 60</text>
<path d="M190.4 136V150M437.6 136V150M190.4 143H437.6" class="dim"/><text x="314" y="133" class="dimtext" text-anchor="middle">103 до начала проёма</text>
<path d="M437.6 136V150M634.4 136V150M437.6 143H634.4" class="dim"/><text x="536" y="133" class="dimtext" text-anchor="middle">82 · дверь</text>
<path d="M634.4 136V150M809.6 136V150M634.4 143H809.6" class="dim"/><text x="722" y="133" class="dimtext" text-anchor="middle">73 до стены</text>
<path d="M634.4 549.2V563.2M665.6 549.2V563.2M634.4 556.2H665.6" class="dim"/><text x="650" y="546.2" class="dimtext" text-anchor="middle">13</text>
<path d="M157.4 789H171.4M157.4 309H171.4M164.4 789V309" class="dim"/><text x="154.4" y="549" class="dimtext" text-anchor="middle" transform="rotate(-90 154.4 549)">200 · стекло с ребра</text>
<path d="M834.6 789H848.6M834.6 580.2H848.6M841.6 789V580.2" class="dim"/><text x="831.6" y="684.6" class="dimtext" text-anchor="middle" transform="rotate(-90 831.6 684.6)">87 столешница</text>
<path d="M117.4 789H131.4M117.4 165H131.4M124.4 789V165" class="dim"/><text x="114.4" y="477" class="dimtext" text-anchor="middle" transform="rotate(-90 114.4 477)">260 от чистого пола</text>
<path d="M190.4 831V845M809.6 831V845M190.4 838H809.6" class="dim"/><text x="500" y="828" class="dimtext" text-anchor="middle">258 — ширина этой стены</text>
<path d="M45 878H955" stroke="#d8dcd5"/>
<text x="45" y="909" font-size="14" class="muted">103 — расстояние от дальней стены душа до начала дверного проёма, а не глубина душевой.</text>
<text x="45" y="936" font-size="14" class="muted">От конца проёма до стены с тумбой: 258 − 103 − 82 = 73. Тумба глубиной 60 оставляет около 13.</text>
<text x="45" y="963" font-size="14" class="muted">От линии стекла до начала проёма: 103 − 94 = 9. Ширина стекла видна на плане сверху.</text>
<text x="45" y="990" font-size="14" class="muted">Высота двери не задана: контур условный. Точные наличники, петли и открывание — по выбранной двери.</text>
<text x="45" y="1040" font-size="12" class="muted">Сантехника обозначена условно. Размеры в см; монтажные уровни оборудования уточняются по изделиям.</text></svg>