<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1060" viewBox="0 0 1000 1060" role="img" aria-labelledby="title desc">
<title id="title">Стена с входной дверью</title><desc id="desc">Смотрим от короба к двери. Душевая слева на развёртке, тумба справа.</desc>
<defs><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#f1ede5"/><path d="M0 0V10" stroke="#dbd2c4"/></pattern></defs>
<style>text{font-family:'Segoe UI',sans-serif;fill:#29342e}.small{font-size:14px}.dim{fill:none;stroke:#778178;stroke-width:1}.dimtext{font-size:16px;fill:#58635b}.muted{fill:#687169}.blue{fill:#286b81}.projection{fill:none;stroke:#8e9d94;stroke-width:1.5;stroke-dasharray:6 5}.woodtext{fill:#fff;font-size:13px}.metal{fill:none;stroke:#738277;stroke-width:3}</style>
<rect width="1000" height="1060" fill="#fff"/>
<text x="45" y="39" font-size="12" letter-spacing="2" class="muted">ВАННАЯ · РАЗВЁРТКА СТЕНЫ</text>
<text x="45" y="77" font-size="27">Стена с входной дверью</text>
<text x="45" y="106" class="small muted">Смотрим от короба к двери. Душевая слева на развёртке, тумба справа.</text>
<rect x="195.2" y="165" width="609.6" height="624" rx="0" fill="#faf9f5" stroke="#879389" stroke-width="1.5" class=""/>
<rect x="195.2" y="165" width="216" height="624" rx="0" fill="#eef3ef" stroke="#879389" stroke-width="1.5" class=""/>
<path d="M411.2 789L411.2 309" fill="none" stroke="#4388a1" stroke-width="4" class=""/>
<text x="305.6" y="489" font-size="19" class="" text-anchor="middle">Душевая</text>
<text x="303.2" y="520.2" font-size="15" class="" text-anchor="middle">глубина 90</text>
<rect x="432.8" y="285" width="196.8" height="504" rx="0" fill="#f1f0e9" stroke="#89958c" stroke-width="2" class=""/>
<rect x="440" y="292.2" width="182.4" height="494.4" rx="0" fill="none" stroke="#b3b9b0" stroke-width="1" class=""/>
<path d="M594.8 551.4L611.6 551.4" fill="none" stroke="#cbd0c8" stroke-width="3" class=""/>
<text x="531.2" y="409.8" font-size="19" class="" text-anchor="middle">Вход · 82</text>
<text x="531.2" y="441" font-size="13" class="muted" text-anchor="middle">Высота проёма</text>
<text x="531.2" y="465" font-size="13" class="muted" text-anchor="middle">по замеру</text>
<rect x="663.2" y="585" width="141.6" height="180" rx="0" fill="#8a674b" stroke="#614d3d" stroke-width="1.5" class=""/>
<rect x="684.8" y="765" width="120" height="24" rx="0" fill="#574635" stroke="#574635" stroke-width="1.5" class=""/>
<rect x="660.8" y="580.2" width="144" height="4.8" rx="0" fill="#e8e8df" stroke="#879389" stroke-width="1.5" class=""/>
<text x="732.8" y="673.8" font-size="16" class="woodtext" text-anchor="middle">Тумба</text>
<text x="732.8" y="702.6" font-size="13" class="woodtext" text-anchor="middle">глубина 60</text>
<path d="M195.2 136V150M432.8 136V150M195.2 143H432.8" class="dim"/><text x="314" y="133" class="dimtext" text-anchor="middle">99 до начала проёма</text>
<path d="M432.8 136V150M629.6 136V150M432.8 143H629.6" class="dim"/><text x="531.2" y="133" class="dimtext" text-anchor="middle">82 · дверь</text>
<path d="M629.6 136V150M804.8 136V150M629.6 143H804.8" class="dim"/><text x="717.2" y="133" class="dimtext" text-anchor="middle">73 до стены</text>
<path d="M629.6 549.2V563.2M660.8 549.2V563.2M629.6 556.2H660.8" class="dim"/><text x="645.2" y="546.2" class="dimtext" text-anchor="middle">13</text>
<path d="M162.2 789H176.2M162.2 309H176.2M169.2 789V309" class="dim"/><text x="159.2" y="549" class="dimtext" text-anchor="middle" transform="rotate(-90 159.2 549)">200 · стекло с ребра</text>
<path d="M829.8 789H843.8M829.8 580.2H843.8M836.8 789V580.2" class="dim"/><text x="826.8" y="684.6" class="dimtext" text-anchor="middle" transform="rotate(-90 826.8 684.6)">87 столешница</text>
<path d="M122.2 789H136.2M122.2 165H136.2M129.2 789V165" class="dim"/><text x="119.2" y="477" class="dimtext" text-anchor="middle" transform="rotate(-90 119.2 477)">260 от чистого пола</text>
<path d="M195.2 831V845M804.8 831V845M195.2 838H804.8" class="dim"/><text x="500" y="828" class="dimtext" text-anchor="middle">254 — ширина этой стены</text>
<path d="M45 878H955" stroke="#d8dcd5"/>
<text x="45" y="909" font-size="14" class="muted">99 — расстояние от дальней стены душа до начала дверного проёма, а не глубина душевой.</text>
<text x="45" y="936" font-size="14" class="muted">От конца проёма до стены с тумбой: 254 − 99 − 82 = 73. Тумба глубиной 60 оставляет около 13.</text>
<text x="45" y="963" font-size="14" class="muted">От линии стекла до начала проёма: 99 − 90 = 9. Ширина стекла видна на плане сверху.</text>
<text x="45" y="990" font-size="14" class="muted">Высота двери не задана: контур условный. Точные наличники, петли и открывание — по выбранной двери.</text>
<text x="45" y="1040" font-size="12" class="muted">Сантехника обозначена условно. Размеры в см; монтажные уровни оборудования уточняются по изделиям.</text></svg>