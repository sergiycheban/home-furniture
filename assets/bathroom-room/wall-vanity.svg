<text x="45" y="909" font-size="14" class="muted">Тумба 175 × 60 × 87; светлая столешница 2; фасады — тёмный орех. Корпус 171 + доборы по 2.</text>
<text x="45" y="936" font-size="14" class="muted">Пять верхних ящиков и четыре нижние дверцы. Цоколь 10, углубление для ног 9; слева две решётки.</text>
<text x="45" y="963" font-size="14" class="muted">Зеркало: низ 115, верх 215. Оси бра: 18,75 и 156,25 от левой стены, высота 165.</text>
<text x="45" y="990" font-size="14" class="muted">Вытяжка находится на боковой стенке короба — она показана на соседней развёртке.</text>
<text x="45" y="1040" font-size="12" class="muted">Сантехника обозначена условно. Размеры в см; монтажные уровни оборудования уточняются по изделиям.</text></svg>